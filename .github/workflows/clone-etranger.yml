# Le clone étranger — RFC-009 §7, critère 1. Sur une machine qui n'a jamais vu
# Kokaji, `git clone` + les commandes du README donnent une instance vide qui
# tient ses quatre coches. Le runner est cette machine neutre : rien n'y
# préexiste, et ce qui manque au README manque ici aussi.
#
# Les clés moteurs sont factices : on prouve que l'instance se lève et se
# décrit, pas qu'elle converse — le banc fait ça, avec de vraies clés.
name: clone-etranger
on:
  workflow_dispatch:
  pull_request:
    paths:
      - dojo/**
      - Dockerfile
      - kokaji/**
      - pyproject.toml
      - atelier/**
      - README.md
      - .github/workflows/clone-etranger.yml
  push:
    branches: [main]
    paths:
      - dojo/**
      - Dockerfile
      - kokaji/**
      - pyproject.toml
      - atelier/**
      - README.md
      - .github/workflows/clone-etranger.yml
jobs:
  clone-etranger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Les images de la pile pèsent près de dix gigaoctets : le runner en a
      # besoin, et il les gaspille en outils qu'on n'utilise pas.
      - name: de la place
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Un vrai clone, pas un checkout : c'est le geste du README.
      - name: git clone
        run: |
          git clone --quiet https://github.com/${{ github.repository }} etranger
          cd etranger && git checkout --quiet ${{ github.sha }}

      - name: le README, ligne à ligne
        working-directory: etranger
        run: |
          pip install --quiet -e .
          cd dojo
          cp .env.example .env
          # Le runner n'est pas l'uid 1000 : les conteneurs écrivent sous son identité.
          sed -i "s/^KOKAJI_UID=.*/KOKAJI_UID=$(id -u)/; s/^KOKAJI_GID=.*/KOKAJI_GID=$(id -g)/" .env
          echo "ANTHROPIC_API_KEY=sk-factice-clone-etranger" >> .env
          mkdir -p harness && cp -r ../atelier harness/atelier && kokaji forge harness/atelier
          kokaji passerelle harness --config litellm/config.yaml --moteurs litellm/moteurs.yaml --nu banc/persona
          docker compose up -d --build

      - name: les quatre coches
        working-directory: etranger/dojo
        run: |
          set -a; . ./.env; set +a
          attendre() {  # attendre <libellé> <commande>
            for i in $(seq 1 60); do
              if sh -c "$2" >/dev/null 2>&1; then echo "✓ $1"; return 0; fi
              sleep 3
            done
            echo "✗ $1"; return 1
          }
          attendre "la passerelle répond" \
            "curl -sf http://localhost:4000/health/liveliness"
          attendre "la liste des modèles porte les kata de l'Atelier" \
            "curl -sf http://localhost:4000/v1/models -H 'Authorization: Bearer $LITELLM_MASTER_KEY' | grep -q '\"atelier/idee\"'"
          attendre "Kokaji répond" \
            "curl -sf http://localhost:8100/sante"
          attendre "le chat s'ouvre" \
            "curl -sf -o /dev/null http://localhost:3000"

      # La leçon d'une boucle de restart qui a saturé un serveur : une pile qui
      # tient ses coches mais redémarre en boucle n'est pas fonctionnelle.
      - name: rien ne boucle
        working-directory: etranger/dojo
        run: |
          sleep 30
          docker compose ps
          for c in $(docker compose ps -q); do
            n=$(docker inspect --format '{{.RestartCount}}' "$c")
            s=$(docker inspect --format '{{.State.Status}}' "$c")
            nom=$(docker inspect --format '{{.Name}}' "$c")
            echo "$nom  $s  redémarrages=$n"
            [ "$s" = running ] && [ "$n" = 0 ] || exit 1
          done

      - name: ce que la pile a dit
        if: always()
        working-directory: etranger/dojo
        run: docker compose logs --tail 40 || true
