# La trempe du produit, à chaque poussée — un vérificateur qui ne tourne pas
# finit par ne plus exister.
name: trempe
on: [push, pull_request]
jobs:
  trempe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vocabulaire local (secret d'instance, jamais publié)
        env:
          VOCABULAIRE_INTERDIT: ${{ secrets.VOCABULAIRE_INTERDIT }}
        run: |
          if [ -n "$VOCABULAIRE_INTERDIT" ]; then
            printf '%s\n' "$VOCABULAIRE_INTERDIT" > trempe/vocabulaire-interdit.local.txt
          else
            echo "::warning::VOCABULAIRE_INTERDIT absent — seuls les interdits publics sont vérifiés."
          fi
      - name: la trempe
        run: ./trempe/check.sh
