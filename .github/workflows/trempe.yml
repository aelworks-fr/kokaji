# La forge se forge elle-même (SPECS §10, R10.2) — un vérificateur qui ne
# tourne pas finit par ne plus exister. Dans l'ordre où ils échouent le plus
# utilement : le dépôt, puis les tests, puis l'Atelier, puis le style.
name: trempe
on: [push, pull_request, workflow_dispatch]
jobs:
  trempe:
    runs-on: ubuntu-latest
    # Le dépôt de ha en base (RFC-014) se joue sur un vrai Postgres, le même
    # jeu de tests que le dépôt des fichiers. Sans lui, ces tests se sautent.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kokaji
          POSTGRES_PASSWORD: essai
          POSTGRES_DB: kokaji_essai
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kokaji" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      KOKAJI_BASE_URL_ESSAI: postgresql://kokaji:essai@127.0.0.1:5432/kokaji_essai
    steps:
      - uses: actions/checkout@v4
      - name: vocabulaire local (secret d'instance, jamais publié)
        env:
          VOCABULAIRE_INTERDIT: ${{ secrets.VOCABULAIRE_INTERDIT }}
        run: |
          if [ -n "$VOCABULAIRE_INTERDIT" ]; then
            printf '%s\n' "$VOCABULAIRE_INTERDIT" > trempe/vocabulaire-interdit.local.txt
          else
            echo "::warning::VOCABULAIRE_INTERDIT absent — seuls les interdits publics sont vérifiés."
          fi
      - name: la trempe du produit
        run: ./trempe/check.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet -e ".[service,dev,base]"
      - name: les tests
        run: python -m pytest -q tests
      - name: le manifest de l'Atelier, et sa trempe statique
        run: |
          python -m kokaji.cli valider atelier kokaji/semence
          python -m kokaji.cli trempe atelier
      - name: le style
        run: python -m ruff check kokaji tests
