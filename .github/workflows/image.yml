# Les deux images du produit, publiées à chaque commit sur main : celle du
# service et de la veille, celle de la vigie avec son navigateur. Une instance
# n'a plus à cloner le produit pour tourner — elle tire l'image et monte ses
# harness (RFC-009 §3).
#
# Deux étiquettes par image : `latest`, et le commit (`sha-abc1234`) pour
# qu'une instance puisse épingler ce qu'elle a validé.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - nom: kokaji
            dockerfile: Dockerfile
          - nom: kokaji-vigie
            dockerfile: dojo/vigie/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.nom }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
