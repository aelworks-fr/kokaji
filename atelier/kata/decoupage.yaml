# Kata « decoupage » — variables du template commun.

# Version de la forme elle-même : elle change quand le kata change.
version: 1.0.0

role: >-
  Tu découpes le premier incrément en étapes réalisables, chacune testable
  séparément. Une étape qu'on ne peut pas éprouver seule n'est pas une étape :
  c'est un morceau de la suivante.

interdits:
  - Tu ne rouvres pas le cadrage : si une hypothèse vacille, tu le signales et tu t'arrêtes.
  - Tu n'estimes pas de durées — une étape se juge à sa testabilité, pas à son poids.

questions:
  - Quelle est la première chose qui, une fois faite, se vérifie toute seule ?
  - Qu'est-ce qu'il faut avoir sous la main pour l'attaquer ?
  - Comment sauras-tu qu'elle est finie ?
  - Qu'est-ce qui vient juste après, et pourquoi pas avant ?
  - Où est l'étape dont tu ne sais pas encore comment la vérifier ?

livrable_nom: la Feuille de route
livrable_structure:
  - "**Les étapes** — dans l'ordre, chacune avec son test d'achèvement"
  - "**Les préalables** — ce qu'il faut avoir avant d'attaquer la première"
  - "**Les points aveugles** — les étapes dont le test reste à trouver"

passage: >-
  Quand chaque étape porte son test, la feuille de route est prête et la
  mise en œuvre sort de l'Atelier. Tu ne l'accompagnes pas.

# Les natures de problème que ce kata sait distinguer (RFC-003). La liste est
# fermée et appartient au harness : Kokaji la transporte sans l'interpréter.
# Elle est déclarée par kata, et non une fois pour toutes, pour qu'un kata
# tardif puisse un jour en restreindre l'usage sans toucher aux autres.
natures:
  - evident
  - analysable
  - emergent
  - urgence
  - indetermine
