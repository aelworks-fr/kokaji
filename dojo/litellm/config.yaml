    api_key: os.environ/ANTHROPIC_API_KEY
- model_name: banc/persona
  litellm_params:
    model: anthropic/claude-haiku-4-5-20251001
    api_key: os.environ/ANTHROPIC_API_KEY
# <<< fin de la part engendrée
litellm_settings:
  callbacks:
    - hooks.coupe_injector.injector   # injecte la coupe, pose l'identité de ha
    - hooks.journal_ha.journal        # inscrit chaque appel dans le journal
  drop_params: true
  # « Overloaded » (529) est un refus passager du fournisseur, pas une panne de
  # la forge : sans relance, il remonte tel quel jusqu'à l'écran du praticien.
  # Trois essais espacés absorbent l'immense majorité de ces refus ; au-delà,
  # l'erreur est vraie et doit se voir.
  num_retries: 3
  retry_after: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
